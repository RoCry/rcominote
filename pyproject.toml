[project]
name = "rcominote"
version = "0.1.0"
description = "CoMi Note BLE control and evidence-based firmware diagnostics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleak>=1.1,<2",
    "capstone==5.0.6",
    "typer>=0.16,<1",
]

[project.scripts]
comi = "rcominote.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
